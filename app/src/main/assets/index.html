    <script>
        /**
         * محرك التخزين الفائق IndexedDB
         */
        const DB_NAME = "GhazaliSuperDB";
        const DB_VERSION = 1;
        let db;

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = e => {
                    const db = e.target.result;
                    db.createObjectStore("contacts", { keyPath: "id" });
                    const txStore = db.createObjectStore("transactions", { keyPath: "id" });
                    txStore.createIndex("date", "date", { unique: false });
                    txStore.createIndex("contactId", "contactId", { unique: false });
                    txStore.createIndex("secondaryId", "secondaryId", { unique: false });
                    db.createObjectStore("settings", { keyPath: "id" });
                };
                request.onsuccess = e => { db = e.target.result; resolve(); };
                request.onerror = e => reject(e);
            });
        }

        const SYNC_URL = "https://vllwgklpewiaxdnpeuvr.supabase.co";
        const SYNC_KEY = "sb_publishable_nTlLO83YOmQJRnDpZl_LOg_qjROfx6G";
        const CLOUD_NAMESPACE = "ghazali_safi_final_2027_v1";
        const MOBILE_SYNC_SEEDED_KEY = "ghazali_safi_final_2027_v1_mobile_synced";
        const cloudType = storeName => `${CLOUD_NAMESPACE}:${storeName}`;
        const cloudFilterMobile = () => encodeURIComponent(`(${cloudType('contacts')},${cloudType('transactions')})`);
        let syncBusy = false;
        function syncHeaders(extra={}) { return { apikey:SYNC_KEY, Authorization:`Bearer ${SYNC_KEY}`, 'Content-Type':'application/json', ...extra }; }
        async function cloudUpsert(){ return; }
        async function cloudDelete(){ return; }

        function saveMobileCloudCache() {
            try {
                localStorage.setItem('ghazali_safi_final_2027_v1_mobile_contacts', JSON.stringify(state.contacts || []));
                localStorage.setItem('ghazali_safi_final_2027_v1_mobile_transactions', JSON.stringify(state.transactions || []));
            } catch(e) { console.warn('mobile cache save failed', e); }
        }
        function loadMobileCloudCache() {
            try {
                const c = JSON.parse(localStorage.getItem('ghazali_safi_final_2027_v1_mobile_contacts') || '[]');
                const t = JSON.parse(localStorage.getItem('ghazali_safi_final_2027_v1_mobile_transactions') || '[]');
                if(Array.isArray(c) && c.length) state.contacts = c;
                if(Array.isArray(t) && t.length) state.transactions = t;
            } catch(e) { console.warn('mobile cache load failed', e); }
        }

        async function syncFromCloudMobile() {
            if(syncBusy) return;
            if(!navigator.onLine){ alert('لا يوجد اتصال بالإنترنت'); return; }
            syncBusy = true;
            try {
                // نطلب مساحة النسخة النهائية فقط. الهاتف للعرض ويعتبر السحابة هي المصدر المعتمد.
                const filter = `(${cloudType('contacts')},${cloudType('transactions')})`;
                const baseUrl = `${SYNC_URL}/rest/v1/ghazali_sync?select=id,record_type,payload,updated_at,deleted&record_type=in.${encodeURIComponent(filter)}&order=id.asc`;
                const rows = [];
                const pageSize = 1000;
                for(let from=0;;from+=pageSize){
                    const to = from + pageSize - 1;
                    const r = await fetch(baseUrl, {method:'GET', headers:syncHeaders({Range:`${from}-${to}`}), cache:'no-store'});
                    if(!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
                    const batch = await r.json();
                    rows.push(...batch);
                    if(batch.length < pageSize) break;
                }

                const contactsMap = new Map();
                const txMap = new Map();
                for(const row of rows) {
                    const payload = row && row.payload;
                    const id = payload && payload.id;
                    if(id === undefined || id === null) continue;
                    if(row.record_type === cloudType('contacts')) {
                        if(row.deleted) contactsMap.delete(String(id));
                        else contactsMap.set(String(id), payload);
                    } else if(row.record_type === cloudType('transactions')) {
                        if(row.deleted) txMap.delete(String(id));
                        else txMap.set(String(id), payload);
                    }
                }

                state.contacts = Array.from(contactsMap.values());
                state.transactions = Array.from(txMap.values());
                saveMobileCloudCache();
                localStorage.setItem(MOBILE_SYNC_SEEDED_KEY,'1');

                // إذا كانت IndexedDB متاحة نحفظ نسخة فيها أيضاً، لكن نجاحها ليس شرطاً للمزامنة.
                if(db) {
                    try {
                        for(const storeName of ['contacts','transactions']) {
                            const values = storeName === 'contacts' ? state.contacts : state.transactions;
                            await new Promise((resolve,reject)=>{
                                const tx = db.transaction(storeName,'readwrite');
                                const store = tx.objectStore(storeName);
                                store.clear();
                                for(const item of values) store.put(item);
                                tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error); tx.onabort=()=>reject(tx.error);
                            });
                        }
                    } catch(e) { console.warn('IndexedDB mirror skipped', e); }
                }

                updateDatalist(); renderSidebar(); renderPage();
                alert(`تم تحديث الهاتف: ${state.contacts.length} اسم و ${state.transactions.length} حركة`);
            } catch(e) {
                alert('تعذر تحديث البيانات: ' + (e && e.message ? e.message : e));
            } finally { syncBusy=false; }
        }

        async function syncAllToCloud(showMessage=true) { return syncFromCloudMobile(); }

        // التخزين الرئيسي على نسخة Windows هو SQLite.
        // يبقى IndexedDB كاحتياط عند فتح ملف HTML خارج Electron.
        function hasSQLiteBridge(){ return !!(window.ghazaliSQLite && window.ghazaliSQLite.save); }
        // الحفظ المحلي لا ينتظر الإنترنت: SQLite يحفظ فوراً، والمزامنة تتم بالخلفية.
        // هذا يمنع تأخر زر حفظ الفاتورة عند ضعف/بطء الاتصال.
        async function dbSave(storeName, data) {
            if(hasSQLiteBridge()) {
                await window.ghazaliSQLite.save(storeName, data);
                if (navigator.onLine && ['contacts','transactions'].includes(storeName)) {
                    setTimeout(() => { cloudUpsert(storeName, data); }, 0);
                }
                return true;
            }
            return new Promise((r,reject) => {
                const tx = db.transaction(storeName, "readwrite");
                tx.objectStore(storeName).put(data);
                tx.oncomplete = () => {
                    r(true);
                    if (navigator.onLine && ['contacts','transactions'].includes(storeName)) {
                        setTimeout(() => { cloudUpsert(storeName, data); }, 0);
                    }
                };
                tx.onerror = () => reject(tx.error);
            });
        }

        async function dbGetAll(storeName) {
            if(hasSQLiteBridge()) return await window.ghazaliSQLite.getAll(storeName);
            return new Promise(r => {

        async function saveInv() {
            if(state.invoiceItems.length===0) return;
            for(let item of state.invoiceItems) {
                const b = await findOrCreateC(item.buyer), s = await findOrCreateC(item.seller);
                const sett = state.settings;
                const raw = item.total, bFee = item.qty * sett.buyerFee, finalB = raw + bFee;
                const sDisc = item.qty * sett.sellerDisc, d1 = raw * (sett.p1/100), d2 = (raw-d1)*(sett.p2/100), finalS = raw - sDisc - d1 - d2;
                b.balance += finalB; s.balance -= finalS;
                const pickedInvoiceDate = document.getElementById('i-date')?.value || new Date().toLocaleDateString('en-CA');
                const nowTime = new Date().toTimeString().slice(0,8);
                const newTx = { id: Date.now()+Math.random(), date: pickedInvoiceDate + 'T' + nowTime, type: 'فاتورة', contactId: b.id, secondaryId: s.id, amount: finalB, details: { tQty: item.qty, raw, sellerCredit: finalS, bFee, sTotalDisc: raw - finalS } };
                state.transactions.push(newTx);
                await dbSave("transactions", newTx);
                await dbSave("contacts", b);
                await dbSave("contacts", s);
            }

        async function payPurchaseGroup(txIds) {
            const invoices = txIds.map(id => state.transactions.find(x => x.id == id && x.type === 'فاتورة')).filter(Boolean);
            const unpaid = invoices.filter(t => !t.details?.purchasePaid);
            if(!unpaid.length) return;
            const sellerId = unpaid[0].secondaryId;
            const seller = state.contacts.find(x => x.id === sellerId);
            if(!seller) return;
            const amount = unpaid.reduce((sum,t)=>sum + Number(t.details?.sellerCredit || 0), 0);
            if(amount <= 0) return;


            const payTx = {
                id: Date.now() + Math.random(),
                date: new Date().toISOString(),
                type: 'دفع',
                contactId: seller.id,
                amount: amount,
                details: { notes: 'واصل مجموع تقرير المشتريات', sourceInvoiceIds: unpaid.map(t=>t.id) }
            };
            seller.balance += amount;
            unpaid.forEach(t => {
                t.details = t.details || {};
                t.details.purchasePaid = true;
                t.details.purchasePaidTxId = payTx.id;
                t.details.purchasePaidAt = payTx.date;
            });

            state.transactions.push(payTx);
            await dbSave('transactions', payTx);
            for(const t of unpaid) await dbSave('transactions', t);
            await dbSave('contacts', seller);
            drawRep('purchases');
        }

                        <button class="btn btn-success" style="flex:1" onclick="backupSQLiteData()">🗄️ نسخ SQLite</button>

        }
        async function saveSett() { state.settings = { ...state.settings, user:document.getElementById('s-u').value, pass:document.getElementById('s-p').value, buyerFee:parseFloat(document.getElementById('s-bf').value)||0, sellerDisc:parseFloat(document.getElementById('s-sd').value)||0, p1:parseFloat(document.getElementById('s-p1').value)||0, p2:parseFloat(document.getElementById('s-p2').value)||0 }; await dbSave("settings", state.settings); alert('تم حفظ الإعدادات'); settLocked = true; renderPage(); }
        
        function exportData() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(state)], {type:'application/json'})); a.download = `Backup_${new Date().toLocaleDateString()}.json`; a.click(); }


        async function backupSQLiteData() {
            if(!window.ghazaliSQLite?.backupSQLite) { alert('نسخ SQLite متاح داخل نسخة Windows فقط'); return; }
            const snapshot = {contacts: state.contacts, transactions: state.transactions, settings: state.settings};
            const r = await window.ghazaliSQLite.backupSQLite(snapshot);
            if(r && r.ok) alert('تم حفظ نسخة SQLite بنجاح');
            else if(r && !r.canceled) alert('تعذر حفظ نسخة SQLite: ' + (r.error || 'خطأ غير معروف'));
        }

        async function restoreSQLiteData() {
            if(!window.ghazaliSQLite?.restoreSQLite) { alert('استعادة SQLite متاحة داخل نسخة Windows فقط'); return; }
            if(!confirm('سيتم استبدال بيانات IndexedDB الحالية بمحتوى نسخة SQLite المختارة. هل تريد المتابعة؟')) return;
            const r = await window.ghazaliSQLite.restoreSQLite();
            if(!r || !r.ok) { if(r && !r.canceled) alert('تعذر استعادة النسخة: ' + (r.error || 'خطأ غير معروف')); return; }
            const imported = r.snapshot;
            if(!imported || !Array.isArray(imported.contacts) || !Array.isArray(imported.transactions) || !imported.settings) { alert('ملف SQLite غير صالح'); return; }
            await new Promise((resolve,reject)=>{
                const tx=db.transaction(['contacts','transactions','settings'],'readwrite');
                tx.objectStore('contacts').clear(); tx.objectStore('transactions').clear(); tx.objectStore('settings').clear();
                tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); tx.onabort=()=>reject(tx.error);
            });
            state.contacts = imported.contacts; state.transactions = imported.transactions; state.settings = imported.settings;
            for(const c of state.contacts) await dbSave('contacts',c);
            for(const t of state.transactions) await dbSave('transactions',t);

        }
        
        // عند الاستيراد نعيد حساب كل فاتورة من العدد والسعر حسب إعدادات البرنامج الحالية،
        // وليس حسب القيم القديمة الموجودة داخل ملف النسخة المستوردة.
        // القيم الافتراضية: أرضية المشتري 2.5، أرضية البائع 0.5، الدلالية 2.5%، وكلها قابلة للتعديل من الإعدادات.
        function recalcImportedData(imported, activeSettings) {
            const sett = activeSettings || state.settings || { buyerFee:2.5, sellerDisc:0.5, p1:2.5, p2:0 };
            const buyerFee = Number(sett.buyerFee) || 0;
            const sellerDisc = Number(sett.sellerDisc) || 0;
            const p1 = Number(sett.p1) || 0;
            const p2 = Number(sett.p2) || 0;

            const contactsById = new Map(imported.contacts.map(c => {
                c.openingBal = Number(c.openingBal) || 0;
                c.balance = c.openingBal;
                return [c.id, c];
            }));

            // أولاً: حساب الفواتير من بياناتها الأصلية (العدد × السعر).
            imported.transactions.forEach(t => {
                if(t.type !== 'فاتورة') return;
                t.details = t.details || {};
                const qty = Number(t.details.tQty) || 0;
                const raw = Number(t.details.raw) || 0;
                const bFee = qty * buyerFee;
                const sDisc = qty * sellerDisc;
                const d1 = raw * (p1 / 100);
                const d2 = (raw - d1) * (p2 / 100);
                const finalB = raw + bFee;
                const finalS = raw - sDisc - d1 - d2;
                t.amount = finalB;
                t.details.bFee = bFee;
                t.details.sellerCredit = finalS;
                t.details.sTotalDisc = raw - finalS;
            });

            // ثانياً: إذا كان هناك "واصل" مرتبط بفواتير مشتريات، حدّث مبلغه حسب الصافي الجديد.
            imported.transactions.forEach(t => {
                if(t.type !== 'دفع' || !Array.isArray(t.details?.sourceInvoiceIds) || !t.details.sourceInvoiceIds.length) return;
                const ids = new Set(t.details.sourceInvoiceIds.map(String));
                t.amount = imported.transactions
                    .filter(x => x.type === 'فاتورة' && ids.has(String(x.id)))
                    .reduce((sum, x) => sum + (Number(x.details?.sellerCredit) || 0), 0);
            });

            // ثالثاً: إعادة بناء الأرصدة حسب الفواتير والسندات بعد تطبيق الخصم والأرضية.
            imported.transactions.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(t => {
                if(t.type === 'فاتورة') {
                    const buyer = contactsById.get(t.contactId);
                    const seller = contactsById.get(t.secondaryId);
                    if(buyer) buyer.balance += Number(t.amount) || 0;
                    if(seller) seller.balance -= Number(t.details?.sellerCredit) || 0;
                } else if(t.type === 'قبض') {
                    const c = contactsById.get(t.contactId); if(c) c.balance -= Number(t.amount) || 0;
                } else if(t.type === 'دفع') {
                    const c = contactsById.get(t.contactId); if(c) c.balance += Number(t.amount) || 0;
                }
            });
            return imported;
        }

        async function importData(e) {
            const f = e.target.files[0]; if(!f) return; const r = new FileReader();
            r.onload = async (ev) => {
                try {
                    let imported = JSON.parse(ev.target.result);
                    if(!imported || !Array.isArray(imported.contacts) || !Array.isArray(imported.transactions) || !imported.settings) throw new Error('invalid backup');
                    const activeSettings = { ...state.settings };
                    imported = recalcImportedData(imported, activeSettings);
                    // احتفظ بإعدادات هذا البرنامج الحالية بعد الاستيراد كي تبقى القيم التي اختارها المستخدم هي المعتمدة.
                    imported.settings = activeSettings;
                    await new Promise((resolve,reject)=>{
                        const tx=db.transaction(["contacts","transactions","settings"],"readwrite");
                        tx.objectStore("contacts").clear(); tx.objectStore("transactions").clear(); tx.objectStore("settings").clear();
                        tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); tx.onabort=()=>reject(tx.error);
                    });
                    state = imported;
                    for(let c of state.contacts) await dbSave("contacts", c);
                    for(let t of state.transactions) await dbSave("transactions", t);
                    await dbSave("settings", state.settings);
                    location.reload();
                } catch(err) { alert('خطأ في الملف'); }
            }; r.readAsText(f);
        }

        function openWipeLock() { document.getElementById('wipe-lock-modal').classList.remove('hidden'); }
        function closeWipeLock() { document.getElementById('wipe-lock-modal').classList.add('hidden'); }
        async function verifyWipeCode() { if (document.getElementById('wipe-pass-input').value === '1977') { if(confirm('هل أنت متأكد؟')) { if(hasSQLiteBridge()) await window.ghazaliSQLite.clearAll(); else indexedDB.deleteDatabase(DB_NAME); location.reload(); } } else alert('الرمز خاطئ'); }

        async function dbDelete(storeName, id) {
            if(hasSQLiteBridge()) { await window.ghazaliSQLite.delete(storeName,id); await cloudDelete(storeName,id); return true; }
            return new Promise((resolve,reject)=>{ const tx=db.transaction(storeName,'readwrite'); tx.objectStore(storeName).delete(id); tx.oncomplete=()=>{ cloudDelete(storeName,id); resolve(true); }; tx.onerror=()=>reject(tx.error); tx.onabort=()=>reject(tx.error); });
        }
        async function detachInvoicePayment(invoice) {
            const payId=invoice?.details?.purchasePaidTxId;
            if(!payId) { if(invoice?.details){ delete invoice.details.purchasePaid; delete invoice.details.purchasePaidTxId; delete invoice.details.purchasePaidAt; } return; }
            const pay=state.transactions.find(x=>x.id==payId && x.type==='دفع'), oldAmount=Number(invoice.details?.sellerCredit||0);
            if(pay) {
                const seller=state.contacts.find(x=>x.id==pay.contactId); if(seller){ seller.balance-=oldAmount; await dbSave('contacts',seller); }
                const ids=(pay.details?.sourceInvoiceIds||[]).filter(x=>x!=invoice.id), newAmount=Math.max(0,Number(pay.amount||0)-oldAmount);
                if(ids.length===0 || newAmount<=0.0000001){ state.transactions=state.transactions.filter(x=>x.id!=pay.id); await dbDelete('transactions',pay.id); }
                else { pay.amount=newAmount; pay.details={...(pay.details||{}),sourceInvoiceIds:ids}; await dbSave('transactions',pay); }
            }
            delete invoice.details.purchasePaid; delete invoice.details.purchasePaidTxId; delete invoice.details.purchasePaidAt;
        }
        async function restoreInvoicesForPayment(pay) {
            for(const id of (pay?.details?.sourceInvoiceIds||[])) { const inv=state.transactions.find(x=>x.id==id&&x.type==='فاتورة'); if(inv&&inv.details?.purchasePaidTxId==pay.id){ delete inv.details.purchasePaid; delete inv.details.purchasePaidTxId; delete inv.details.purchasePaidAt; await dbSave('transactions',inv); } }
        }

        function openEdit(id, type) {
            window.editId = id; window.editType = type; const modal = document.getElementById('edit-modal'), content = document.getElementById('modal-content');
            const actions = modal.querySelector('.modal-box > div:last-child'); if(actions) actions.innerHTML = `<button class="btn btn-success" style="flex:1" onclick="saveModal()">حفظ</button><button class="btn btn-danger" style="flex:1" onclick="closeModal()">إلغاء</button>`; modal.querySelector('.modal-box').style.width='420px';
            if(type==='contact') {
                const c = (id !== null && id !== undefined) ? state.contacts.find(x=>String(x.id)===String(id)) : { name:'', phone:'', address:'', openingBal:0 }; if(!c){ alert('تعذر العثور على الاسم'); return; } document.getElementById('modal-title').innerText = id ? 'تعديل اسم' : 'إضافة اسم';
                content.innerHTML = `<label>الاسم</label><input id="e-c-name" value="${c.name}" onkeydown="navNext(event, 'e-c-address')"><label>العنوان</label><input id="e-c-address" value="${c.address||''}" onkeydown="navNext(event, 'e-c-phone')"><label>الهاتف</label><input id="e-c-phone" value="${c.phone||''}" onkeydown="navNext(event, 'e-c-open')"><label>افتتاحي</label><input type="number" id="e-c-open" value="${c.openingBal}" onkeydown="if(event.key==='Enter'){event.preventDefault();saveModal();}">`; setTimeout(()=>document.getElementById('e-c-name')?.focus(),0);
            } else if(type==='tx') {
                const t = state.transactions.find(x=>x.id===id); if(t?.type==='دفع' && t.details?.sourceInvoiceIds?.length) { alert('واصل بواسطة الفاتورة مرتبط بالفواتير. عدّل الفاتورة نفسها ليتم تحديث الواصل بصورة صحيحة.'); return; } document.getElementById('modal-title').innerText = 'تعديل العملية';
                if(t.type==='فاتورة') {
                    const b = state.contacts.find(x=>x.id===t.contactId), s = state.contacts.find(x=>x.id===t.secondaryId);
                    content.innerHTML = `<label>العدد</label><input type="number" id="e-qty" value="${t.details.tQty}"><label>السعر</label><input type="number" id="e-price" value="${(t.details.raw/t.details.tQty).toFixed(2)}"><label>المشتري</label><input list="global-contacts-list" id="e-buyer" value="${b.name}" oninput="autoCompleteName(event)"><label>البائع</label><input list="global-contacts-list" id="e-seller" value="${s.name}" oninput="autoCompleteName(event)">`;
                } else content.innerHTML = `<label>المبلغ</label><input type="number" id="e-amt" value="${t.amount}"><label>ملاحظات</label><input type="text" id="e-note" value="${t.details.notes||''}">`;
            } modal.classList.remove('hidden');
        }

        async function saveModal() {
            let sn, sf, st; const isSt = (state.activeTab==='statement');
            if(isSt){ sn=document.getElementById('st-search').value; sf=''; st=''; }
            if(window.editType==='contact') {
                const n = document.getElementById('e-c-name').value.trim(), p = document.getElementById('e-c-phone').value, a = document.getElementById('e-c-address').value, o = parseFloat(document.getElementById('e-c-open').value)||0; if(!n) return;
                const exists = state.contacts.find(x => x.name.trim() === n && String(x.id) !== String(window.editId)); if(exists) return alert('الاسم موجود!');
                if(window.editId !== null && window.editId !== undefined) { const c = state.contacts.find(x=>String(x.id)===String(window.editId)); if(!c) return alert('تعذر العثور على الاسم'); c.balance += (o-(Number(c.openingBal)||0)); c.name=n; c.phone=p; c.address=a; c.openingBal=o; await dbSave("contacts", c); }
                else {
                    const newC = {id:Date.now(), name:n, phone:p, address:a, openingBal:o, balance:o};
                    state.contacts.push(newC); await dbSave("contacts", newC);
                    // عند إضافة اسم جديد: أبقِ النافذة مفتوحة لإدخال أسماء أخرى
                    updateDatalist();
                    document.getElementById('e-c-name').value='';
                    document.getElementById('e-c-address').value='';
                    document.getElementById('e-c-phone').value='';
                    document.getElementById('e-c-open').value='0';
                    document.getElementById('e-c-name').focus();
                    return;
                }
            } else {
                const t = state.transactions.find(x=>x.id===window.editId);
                if(t.type==='فاتورة') {
                    const nQ=parseFloat(document.getElementById('e-qty').value), nP=parseFloat(document.getElementById('e-price').value), nBN=document.getElementById('e-buyer').value.trim(), nSN=document.getElementById('e-seller').value.trim();
                    if(!(nQ>0) || !(nP>0) || !nBN || !nSN) return alert('أدخل بيانات صحيحة');
                    const oldB=state.contacts.find(x=>x.id==t.contactId), oldS=state.contacts.find(x=>x.id==t.secondaryId);
                    if(t.details?.purchasePaid) await detachInvoicePayment(t);
                    oldB.balance-=t.amount; oldS.balance+=t.details.sellerCredit;
                    const newB=await findOrCreateC(nBN), newS=await findOrCreateC(nSN), sett=state.settings, nR=nQ*nP;
                    const nFB=nR+(nQ*sett.buyerFee), nFS=nR-(nQ*sett.sellerDisc)-(nR*(sett.p1/100))-((nR-(nR*(sett.p1/100)))*(sett.p2/100));
                    t.contactId=newB.id; t.secondaryId=newS.id; t.amount=nFB; t.details={...t.details, tQty:nQ, raw:nR, sellerCredit:nFS}; newB.balance+=nFB; newS.balance-=nFS;
                    await dbSave("transactions", t); await dbSave("contacts", newB); await dbSave("contacts", newS);
                    if(oldB.id !== newB.id) await dbSave("contacts", oldB); if(oldS.id !== newS.id) await dbSave("contacts", oldS);
                } else {
                    if(t.type==='دفع' && t.details?.sourceInvoiceIds?.length) return alert('واصل بواسطة الفاتورة مرتبط بالفواتير ولا يعدل كسند مستقل.');
                    const nA=parseFloat(document.getElementById('e-amt').value); if(!(nA>0)) return alert('أدخل مبلغاً صحيحاً');
                    const c=state.contacts.find(x=>x.id==t.contactId); if(!c) return; if(t.type==='قبض') c.balance+=t.amount; else c.balance-=t.amount;
                    t.amount=nA; t.details=t.details||{}; t.details.notes=document.getElementById('e-note').value;
                    if(t.type==='قبض') c.balance-=nA; else c.balance+=nA;
                    await dbSave("transactions", t); await dbSave("contacts", c);
                }
            } closeModal(); renderPage();
            if(isSt){ document.getElementById('st-search').value=sn; drawSt(); }
        }


        async function deleteStatementDetail(id, date, kind, contactId) {
            if(!confirm('حذف العملية؟')) return;
            const t = state.transactions.find(x=>x.id==id); if(!t) return;
            if(t.type==='فاتورة') { if(t.details?.purchasePaid) await detachInvoicePayment(t); const b=state.contacts.find(x=>x.id==t.contactId), s=state.contacts.find(x=>x.id==t.secondaryId); b.balance-=t.amount; s.balance+=t.details.sellerCredit; await dbSave('contacts',b); await dbSave('contacts',s); }
            else { if(t.type==='دفع' && t.details?.sourceInvoiceIds?.length) await restoreInvoicesForPayment(t); const c=state.contacts.find(x=>x.id==t.contactId); if(t.type==='قبض') c.balance+=t.amount; else c.balance-=t.amount; await dbSave('contacts',c); }
            state.transactions = state.transactions.filter(x=>x.id!=id);
            await new Promise(r=>{ const q=db.transaction('transactions','readwrite'); q.objectStore('transactions').delete(id); q.oncomplete=r; });
            drawSt();
            const remains=state.transactions.some(x=>(x.contactId===contactId||x.secondaryId===contactId)&&x.date.startsWith(date)&&statementMoveKind(x,state.contacts.find(c=>c.id===contactId))===kind);
            if(remains) openStatementGroupDetails(date,kind,contactId); else closeModal();
        }

        async function delTx(id) {
            if(!confirm('حذف العملية؟')) return; const t=state.transactions.find(x=>x.id==id); if(!t) return;
            if(t.type==='فاتورة'){ if(t.details?.purchasePaid) await detachInvoicePayment(t); const b=state.contacts.find(x=>x.id==t.contactId),s=state.contacts.find(x=>x.id==t.secondaryId); b.balance-=t.amount; s.balance+=t.details.sellerCredit; await dbSave('contacts',b); await dbSave('contacts',s); }
            else { if(t.type==='دفع'&&t.details?.sourceInvoiceIds?.length) await restoreInvoicesForPayment(t); const c=state.contacts.find(x=>x.id==t.contactId); if(t.type==='قبض') c.balance+=t.amount; else c.balance-=t.amount; await dbSave('contacts',c); }
            state.transactions=state.transactions.filter(x=>x.id!=id); await dbDelete('transactions',id); renderPage();
        }

        async function delC(id) { 
            const hasTx = state.transactions.some(t=>t.contactId===id||t.secondaryId===id);
            if(hasTx) { const pass = prompt('هذا الاسم مرتبطة به عمليات. أدخل رمز النظام للحذف النهائي:'); if(pass !== state.settings.pass) { alert('الرمز خاطئ!'); return; } }
            else { if(!confirm('هل أنت متأكد من الحذف؟')) return; }
            state.contacts=state.contacts.filter(c=>String(c.id)!==String(id));
            const tx = db.transaction("contacts", "readwrite"); tx.objectStore("contacts").delete(id); drawC(); 
        }

        function closeModal() { document.getElementById('edit-modal').classList.add('hidden'); window.editId=null; }

        async function findOrCreateC(n) { 
            let c = state.contacts.find(x=>x.name.trim()===n.trim()); 
            if(!c) { c={id:Date.now()+Math.random(), name:n.trim(), balance:0, address:'', openingBal:0}; state.contacts.push(c); await dbSave("contacts", c); } 
            return c; 
        }
    </script>
